version: "3.9"

# Docker Compose file for SentinelTrack PostgreSQL development environment.
# Docker is not available on this machine — this file is provided for
# environments where Docker is installed.
#
# Usage:
#   docker-compose up -d         # Start PostgreSQL
#   docker-compose down          # Stop and remove containers
#   docker-compose logs postgres # View logs

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentineltrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SENTINEL_DB_NAME:-sentineltrack}
      POSTGRES_USER: ${SENTINEL_DB_USER:-sentineluser}
      POSTGRES_PASSWORD: ${SENTINEL_DB_PASSWORD:-changeme_strong_password}
    ports:
      - "${SENTINEL_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SENTINEL_DB_USER:-sentineluser} -d ${SENTINEL_DB_NAME:-sentineltrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin web interface for database inspection
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentineltrack_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sentineltrack.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - admin  # Only started with: docker-compose --profile admin up -d

volumes:
  postgres_data:
    driver: local
